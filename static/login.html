<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Sign in — SAIRA</title>
  <link rel="stylesheet" href="/static/theme.css"/>
  <style>
    .shell { max-width: 420px; margin: 0 auto; padding: 60px 20px; }
    h1 { font-family:'Orbitron',sans-serif; font-size:1.05rem; letter-spacing:.2em;
         color:#fff; text-shadow:0 0 18px var(--g1); margin-bottom:6px; }
    .lead { font-size:.74rem; color:var(--g-dim); margin-bottom:24px; }
    .alt { text-align:center; margin-top:18px; font-size:.72rem; color:var(--g-dim); }
  </style>
</head>
<body>
<div class="scan-line"></div>
<div class="wrap">
  <nav class="nav">
    <div class="brand"><a href="/" style="color:inherit">S<span>.</span>A<span>.</span>I<span>.</span>R<span>.</span>A</a></div>
    <div class="nav-right"><a href="/register">Create account</a></div>
  </nav>

  <div class="shell">
    <div class="panel">
      <h1>SIGN IN</h1>
      <p class="lead">Welcome back.</p>

      <div class="msg error" id="err"></div>

      <form id="form" novalidate>
        <div class="field">
          <label for="email">Email</label>
          <input id="email" type="email" autocomplete="email" required autofocus/>
        </div>
        <div class="field">
          <label for="password">Password</label>
          <input id="password" type="password" autocomplete="current-password" required/>
        </div>
        <button class="full" id="submit" type="submit">Sign in</button>
      </form>

      <div class="alt">No account yet? <a href="/register">Create one</a></div>
    </div>
  </div>
</div>

<script>
const $ = s => document.querySelector(s);
const err = $('#err');

$('#form').addEventListener('submit', async e => {
  e.preventDefault();
  err.classList.remove('show');
  const btn = $('#submit');
  btn.disabled = true; btn.textContent = 'Signing in…';
  try {
    const res = await fetch('/api/login', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ email: $('#email').value, password: $('#password').value }),
    });
    const data = await res.json().catch(() => ({}));
    if (!res.ok) throw new Error(data.detail || 'Could not sign in.');
    window.location.href = data.role === 'admin' ? '/app' : '/app';
  } catch (ex) {
    err.textContent = ex.message; err.classList.add('show');
    btn.disabled = false; btn.textContent = 'Sign in';
  }
});
</script>
</body>
</html>
