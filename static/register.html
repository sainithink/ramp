<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Create account — SAIRA</title>
  <link rel="stylesheet" href="/static/theme.css"/>
  <style>
    .shell { max-width: 460px; margin: 0 auto; padding: 44px 20px 60px; }
    h1 { font-family:'Orbitron',sans-serif; font-size:1.05rem; letter-spacing:.2em;
         color:#fff; text-shadow:0 0 18px var(--g1); margin-bottom:6px; }
    .lead { font-size:.74rem; color:var(--g-dim); margin-bottom:24px; }
    .alt { text-align:center; margin-top:18px; font-size:.72rem; color:var(--g-dim); }
    .name-preview {
      margin-top: 8px; padding: 9px 12px; border-radius: 3px;
      background: rgba(0,230,118,.05); border: 1px solid var(--g-glow);
      font-size: .74rem; color: var(--g1); min-height: 34px;
    }
    .name-preview.bad { border-color: rgba(255,82,82,.45); color: var(--err); }
  </style>
</head>
<body>
<div class="scan-line"></div>
<div class="wrap">
  <nav class="nav">
    <div class="brand"><a href="/" style="color:inherit">S<span>.</span>A<span>.</span>I<span>.</span>R<span>.</span>A</a></div>
    <div class="nav-right"><a href="/login">Sign in</a></div>
  </nav>

  <div class="shell">
    <div class="panel">
      <h1>CREATE ACCOUNT</h1>
      <p class="lead">Free — 100 conversations a month, no card needed.</p>

      <div class="msg error" id="err"></div>

      <form id="form" novalidate>
        <div class="field">
          <label for="email">Email</label>
          <input id="email" type="email" autocomplete="email" required placeholder="you@example.com"/>
        </div>

        <div class="field">
          <label for="password">Password</label>
          <input id="password" type="password" autocomplete="new-password" required
                 minlength="8" placeholder="at least 8 characters"/>
        </div>

        <div class="field">
          <label for="wake">What should it answer to?</label>
          <input id="wake" type="text" value="Saira" maxlength="24" placeholder="Saira"/>
          <div class="name-preview" id="preview">You'll say <strong>“Hey Saira”</strong> to wake it.</div>
          <div class="hint">
            One word, letters only, 3–24 characters. You can change it later.
          </div>
        </div>

        <button class="full" id="submit" type="submit">Create account</button>
      </form>

      <div class="alt">Already have an account? <a href="/login">Sign in</a></div>
    </div>
  </div>
</div>

<script>
const $ = s => document.querySelector(s);
const err = $('#err'), wake = $('#wake'), preview = $('#preview');

function showError(m) { err.textContent = m; err.classList.add('show'); }
function clearError() { err.classList.remove('show'); }

// Mirror the server-side rules in core/auth.validate_wake_name so the user
// gets immediate feedback instead of a round trip.
function checkName(raw) {
  const n = (raw || '').trim();
  if (!n) return { ok: true, name: 'Saira' };
  if (n.length > 24) return { ok: false, why: 'Too long — 24 characters max.' };
  if (!/^[A-Za-z ]+$/.test(n)) return { ok: false, why: 'Letters only.' };
  if (n.trim().split(/\s+/).length > 1) return { ok: false, why: 'Use a single word so it can be detected reliably.' };
  if (n.length < 3) return { ok: false, why: 'At least 3 letters — shorter names trigger on ordinary speech.' };
  return { ok: true, name: n.charAt(0).toUpperCase() + n.slice(1).toLowerCase() };
}

function renderPreview() {
  const r = checkName(wake.value);
  if (r.ok) {
    preview.classList.remove('bad');
    preview.innerHTML = `You'll say <strong>“Hey ${r.name}”</strong> to wake it.`;
  } else {
    preview.classList.add('bad');
    preview.textContent = r.why;
  }
}
wake.addEventListener('input', renderPreview);
renderPreview();

$('#form').addEventListener('submit', async e => {
  e.preventDefault();
  clearError();
  const name = checkName(wake.value);
  if (!name.ok) return showError(name.why);

  const btn = $('#submit');
  btn.disabled = true; btn.textContent = 'Creating…';
  try {
    const res = await fetch('/api/register', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({
        email: $('#email').value,
        password: $('#password').value,
        wake_name: name.name,
      }),
    });
    const data = await res.json().catch(() => ({}));
    if (!res.ok) throw new Error(data.detail || 'Could not create the account.');
    window.location.href = '/app';
  } catch (ex) {
    showError(ex.message);
    btn.disabled = false; btn.textContent = 'Create account';
  }
});
</script>
</body>
</html>
