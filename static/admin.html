<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Admin — SAIRA</title>
  <link rel="stylesheet" href="/static/theme.css"/>
  <style>
    .shell { max-width: 1240px; margin: 0 auto; padding: 26px 20px 60px; }
    h1 { font-family:'Orbitron',sans-serif; font-size:.95rem; letter-spacing:.2em;
         color:#fff; text-shadow:0 0 18px var(--g1); margin-bottom:18px; }
    .stats { display:grid; grid-template-columns:repeat(auto-fit,minmax(180px,1fr));
             gap:12px; margin-bottom:20px; }
    .stat .k { font-size:.58rem; letter-spacing:.16em; text-transform:uppercase; color:var(--g-dim); }
    .stat .v { font-family:'Orbitron',sans-serif; font-size:1.5rem; color:var(--g1);
               text-shadow:0 0 14px rgba(0,230,118,.35); margin-top:5px; }
    .tablewrap { overflow-x:auto; }
    .usecell { display:flex; align-items:center; gap:8px; white-space:nowrap; }
    .row-actions { display:flex; gap:6px; flex-wrap:wrap; }
    .row-actions button, .row-actions select { padding:5px 9px; font-size:.56rem; }
    .row-actions select { width:auto; padding:5px 7px; }
    .muted { color:var(--g-dim); }
    .empty { padding:36px; text-align:center; color:var(--g-dim); font-size:.78rem; }
  </style>
</head>
<body>
<div class="scan-line"></div>
<div class="wrap">
  <nav class="nav">
    <div class="brand"><a href="/app" style="color:inherit">S<span>.</span>A<span>.</span>I<span>.</span>R<span>.</span>A</a></div>
    <div class="nav-right">
      <span class="muted" style="font-size:.62rem;letter-spacing:.12em">ADMIN</span>
      <a href="/app">Assistant</a>
      <button class="ghost" onclick="logout()">Sign out</button>
    </div>
  </nav>

  <div class="shell">
    <h1>USERS &amp; USAGE</h1>
    <div class="msg error" id="err"></div>
    <div class="msg ok" id="ok"></div>

    <div class="stats" id="stats"></div>

    <div class="panel" style="padding:0;overflow:hidden">
      <div class="tablewrap">
        <table>
          <thead>
            <tr>
              <th>User</th><th>Calls it</th><th>Plan</th>
              <th>This month</th><th>All time</th><th>Status</th><th>Actions</th>
            </tr>
          </thead>
          <tbody id="rows"></tbody>
        </table>
      </div>
      <div class="empty" id="empty" style="display:none">No users yet.</div>
    </div>
  </div>
</div>

<script>
const $ = s => document.querySelector(s);
let PLANS = {};

function flash(el, text) {
  el.textContent = text; el.classList.add('show');
  setTimeout(() => el.classList.remove('show'), 4000);
}
const showErr = t => flash($('#err'), t);
const showOk  = t => flash($('#ok'), t);

function esc(s) {
  return String(s ?? '').replace(/[&<>"']/g, c =>
    ({ '&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;' }[c]));
}

function meter(used, limit) {
  const pct = limit > 0 ? Math.min(100, (used / limit) * 100) : 0;
  const cls = pct >= 100 ? 'full' : pct >= 80 ? 'warn' : '';
  return `<div class="usecell">
            <div class="meter ${cls}" title="${used} of ${limit}"><div style="width:${pct}%"></div></div>
            <span>${used}/${limit}</span>
          </div>`;
}

async function load() {
  try {
    const res = await fetch('/api/admin/users');
    if (res.status === 403) { window.location.href = '/app'; return; }
    if (res.status === 401) { window.location.href = '/login'; return; }
    const data = await res.json();
    PLANS = data.plans || {};

    $('#stats').innerHTML = [
      ['Total users', data.stats.total_users],
      ['Active', data.stats.active_users],
      ['Admins', data.stats.admins],
      ['Conversations this month', data.stats.conversations_this_month],
    ].map(([k, v]) => `<div class="panel stat"><div class="k">${k}</div><div class="v">${v}</div></div>`).join('');

    const rows = data.users || [];
    $('#empty').style.display = rows.length ? 'none' : 'block';
    $('#rows').innerHTML = rows.map(u => `
      <tr>
        <td>
          <div>${esc(u.display_name || '—')}</div>
          <div class="muted" style="font-size:.62rem">${esc(u.email)}</div>
        </td>
        <td>${esc(u.wake_name)}</td>
        <td>
          <span class="badge ${u.plan === 'pro' ? 'pro' : ''}">${esc(u.plan)}</span>
          ${u.role === 'admin' ? '<span class="badge admin">admin</span>' : ''}
          ${u.custom_limit !== null ? `<div class="muted" style="font-size:.58rem;margin-top:3px">custom ${u.custom_limit}</div>` : ''}
        </td>
        <td>${meter(u.used, u.limit)}</td>
        <td>${u.total}</td>
        <td><span class="badge ${u.is_active ? '' : 'off'}">${u.is_active ? 'active' : 'disabled'}</span></td>
        <td>
          <div class="row-actions">
            <select onchange="setPlan('${u.id}', this.value)" title="Plan">
              ${Object.keys(PLANS).map(p =>
                `<option value="${p}" ${p === u.plan ? 'selected' : ''}>${p} (${PLANS[p]})</option>`).join('')}
            </select>
            <button class="ghost" onclick="setLimit('${u.id}', ${u.custom_limit})">Limit</button>
            <button class="${u.is_active ? 'danger' : 'ghost'}"
                    onclick="setActive('${u.id}', ${!u.is_active})">
              ${u.is_active ? 'Disable' : 'Enable'}
            </button>
          </div>
        </td>
      </tr>`).join('');
  } catch (ex) {
    showErr('Could not load users: ' + ex.message);
  }
}

async function patch(id, body, okMsg) {
  try {
    const res = await fetch(`/api/admin/users/${id}`, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify(body),
    });
    const data = await res.json().catch(() => ({}));
    if (!res.ok) throw new Error(data.detail || 'Update failed.');
    showOk(okMsg);
    load();
  } catch (ex) { showErr(ex.message); load(); }
}

const setPlan   = (id, plan)   => patch(id, { plan }, `Plan set to ${plan}.`);
const setActive = (id, active) => patch(id, { is_active: active },
                                        active ? 'Account enabled.' : 'Account disabled.');

function setLimit(id, current) {
  const raw = prompt('Monthly conversation limit for this user.\nLeave blank to use the plan default.',
                     current === null ? '' : current);
  if (raw === null) return;                       // cancelled
  if (raw.trim() === '') return patch(id, { clear_custom_limit: true }, 'Reverted to plan default.');
  const n = parseInt(raw, 10);
  if (Number.isNaN(n) || n < 0) return showErr('Enter a whole number of conversations, or leave blank.');
  patch(id, { custom_limit: n }, `Limit set to ${n}.`);
}

async function logout() {
  await fetch('/api/logout', { method: 'POST' });
  window.location.href = '/';
}

load();
setInterval(load, 30000);   // usage counters move while people talk
</script>
</body>
</html>
